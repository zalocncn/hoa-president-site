<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="HOA President">
  <!-- The HOA President mark: the Cedar Hollow association seal, simplified — an
       eight-point rose (compass or impact sprinkler, reader's choice) in a ring.
       Original design; not a real association's seal. -->
  <rect width="200" height="200" rx="34" fill="#0C120C"/>
  <circle cx="100" cy="100" r="66" fill="none" stroke="#8F977F" stroke-width="5"/>
  <g fill="#F2EFE2">
    <rect x="74" y="74" width="52" height="52"/>
    <rect x="74" y="74" width="52" height="52" transform="rotate(45 100 100)"/>
  </g>
  <circle cx="100" cy="100" r="10" fill="#0C120C"/>
  <circle cx="100" cy="100" r="5" fill="#7FC98B"/>
</svg>
